site_name: Excel → Python → SQL → Power BI Cheat Sheet
site_description: Guia prático para profissionais de Dados e Analytics
site_author: Vagner Xavier
site_url: https://vagnerx.github.io/excel-python-sql-powerbi-cheatsheet/

repo_name: vagnerx/excel-python-sql-powerbi-cheatsheet
repo_url: https://github.com/vagnerx/excel-python-sql-powerbi-cheatsheet

theme:
  name: material
  language: pt-BR

  logo: assets/logo.png
  favicon: assets/favicon.png

  palette:
    - scheme: default
      primary: blue
      accent: amber

  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

nav:
  - Home:
      - Início: index.md

  - Cheat Sheet:
      - Grupo A · Manipulação Básica:
          - 01. Importar Dados: 01-importar-dados.md
          - 02. Filtrar Linhas: 02-filtrar-linhas.md
          - 03. Selecionar Colunas: 03-selecionar-colunas.md
          - 04. Ordenar Dados: 04-ordenar-dados.md
          - 05. Agrupar: 05-agrupar-agregar.md
          - 06. Contar Linhas: 06-contar-linhas.md
          - 07. Média: 07-media.md
          - 08. Soma: 08-soma.md

      - Grupo B · Transformação:
          - 09. Valores Únicos: 09-obter-valores-unicos.md
          - 10. Renomear Colunas: 10-renomear-colunas.md
          - 11. Tipos de Dados: 11-tipos-de-dados.md
          - 12. Tratar Nulos: 12-tratar-nulos.md
          - 13. Merge Join: 13-merge-join.md
          - 14. Coluna Condicional: 14-coluna-condicional.md

      - Grupo C · Datas e Métricas:
          - 15. Min Max: 15-min-max.md
          - 16. Datas: 16-extracao-datas.md
          - 17. Filtrar por Data: 17-filtrar-por-data.md
          - 18. Contar Únicos: 18-contar-unicos.md
          - 19. Top N: 19-top-n.md
          - 20. Percentual: 20-percentual.md

      - Grupo D · Analytics Avançado:
          - 21. Ranking: 21-ranking.md
          - 22. Acumulado: 22-acumulado.md
          - 23. Janela Móvel: 23-janela-movel.md
          - 24. Pivot / Unpivot: 24-pivot-unpivot.md

  - Exemplos:
      - Excel:
          - Visão Geral: examples/excel/README.md
      - Python:
          - Visão Geral: examples/python/README.md
      - SQL:
          - Visão Geral: examples/sql/README.md
      - Power BI:
          - Visão Geral: examples/powerbi/README.md

  - Recursos:
      - Dataset: datasets/employees.md
      - Roadmap: roadmap.md
